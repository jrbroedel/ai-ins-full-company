<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Access denied</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background: #0f1115; color: #e6e6e6; display: grid; place-items: center;
           min-height: 100vh; margin: 0; }
    .card { max-width: 30rem; padding: 2rem; text-align: center; }
    h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
    p { color: #9aa0a6; line-height: 1.5; }
    a { color: #6ea8fe; }
  </style>
</head>
<body>
  <div class="card">
    <h1>You don't have access to this dashboard</h1>
    <p>Your account signed in successfully, but it isn't on the access list for this
       application. Ask an administrator to add you to the dashboard access group.</p>
    <p><a href="/logout">Sign out</a></p>
  </div>
</body>
</html>
