; OCA server_environment config for running_env = production (ADR 0009 Deviation 7).
;
; Section name format is NOT free-form. It is:
;   <model _name, dots replaced by underscores>.<value of the field named in
;   the model's _server_env_section_name_field>
; fs_storage overrides that field to "code" rather than the mixin's default
; "name", so the section is the record's `code` (azure_blob_documents), NOT its
; display name ("Azure Blob - documents").
;
; use_as_default_for_attachments has NO column in Postgres - it is a
; config-file-only field. Writing it through the ORM appears to succeed and
; silently reverts on the next read. This file is the only thing that sets it.
;
; DO NOT PUT CREDENTIALS IN THIS FILE. See the README.md one directory up.

[fs_storage.azure_blob_documents]
use_as_default_for_attachments = true
